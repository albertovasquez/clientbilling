name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  test-phone:
    name: Phone width (320 and 390)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Backgrounded with nohup so the server outlives this step.
      - name: Start the built server
        run: |
          nohup npx next start -p 3311 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3311/ && exit 0
            sleep 1
          done
          echo "server did not come up on 3311" >&2
          cat /tmp/next-start.log >&2
          exit 1
      # ubuntu-latest ships Chrome; CHROME_PATH pins it rather than guessing.
      # The script refuses to skip when CI is set, so a missing browser fails.
      - run: npm run test:phone
        env:
          CI: "true"
          CHROME_PATH: /usr/bin/google-chrome

  test-db:
    name: Database flow tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clientbilling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clientbilling_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clientbilling_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/clientbilling_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:db
